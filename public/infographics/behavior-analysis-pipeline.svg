<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 580" width="100%" height="100%">
  <defs>
    <linearGradient id="bg5" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0e1a"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#0a0e1a"/>
    </linearGradient>
    <linearGradient id="cam-cyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
    <linearGradient id="vision-purple" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>
    <linearGradient id="onnx-emerald" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <linearGradient id="metric-amber" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#f43f5e"/>
    </linearGradient>

    <filter id="shadow5" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#000000" flood-opacity="0.5"/>
    </filter>

    <marker id="arr5" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#38bdf8" />
    </marker>
    <marker id="arr5-purple" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#c084fc" />
    </marker>
    <marker id="arr5-emerald" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#34d399" />
    </marker>
    <marker id="arr5-amber" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#fbbf24" />
    </marker>
  </defs>

  <style>
    .title { font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; font-weight: 800; fill: #ffffff; }
    .subtitle { font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; font-weight: 400; fill: #94a3b8; }
    .card-title { font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; font-weight: 700; font-size: 14.5px; fill: #f8fafc; }
    .card-sub { font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; font-weight: 600; font-size: 11px; }
    .card-desc { font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; font-weight: 400; font-size: 11.5px; fill: #94a3b8; }
    .code-pill { font-family: 'JetBrains Mono', 'Fira Code', monospace; font-size: 10.5px; fill: #38bdf8; }
    .privacy-tag { font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; font-weight: 700; font-size: 11px; fill: #10b981; }
  </style>

  <!-- Background -->
  <rect width="1200" height="580" rx="16" fill="url(#bg5)" stroke="#334155" stroke-width="1.2"/>

  <!-- Subtle grid -->
  <g opacity="0.05">
    <path d="M 0,100 L 1200,100 M 0,250 L 1200,250 M 0,420 L 1200,420" stroke="#ffffff" stroke-width="1"/>
    <path d="M 300,0 L 300,580 M 600,0 L 600,580 M 900,0 L 900,580" stroke="#ffffff" stroke-width="1"/>
  </g>

  <!-- Header -->
  <g transform="translate(60, 38)">
    <rect x="0" y="0" width="40" height="40" rx="10" fill="url(#cam-cyan)"/>
    <circle cx="20" cy="20" r="8" stroke="#ffffff" stroke-width="2" fill="none"/>
    <circle cx="20" cy="20" r="3" fill="#ffffff"/>
    <text x="54" y="20" class="title" font-size="22">On-Device Behavioral &amp; Emotion Analysis Pipeline</text>
    <text x="54" y="38" class="subtitle" font-size="13">Real-time facial tracking, micro-expression classification, and composure scoring executed 100% in the client browser</text>
  </g>

  <!-- Privacy Shield Banner -->
  <g transform="translate(60, 96)">
    <rect width="1080" height="38" rx="8" fill="#064e3b" fill-opacity="0.3" stroke="#059669" stroke-width="1.2"/>
    <circle cx="24" cy="19" r="8" fill="#10b981" fill-opacity="0.2"/>
    <path d="M 20,19 L 23,22 L 28,16" stroke="#10b981" stroke-width="2" stroke-linecap="round" fill="none"/>
    <text x="40" y="23" class="privacy-tag">🔒 100% ON-DEVICE PRIVACY GUARANTEE:</text>
    <text x="320" y="23" class="card-desc" fill="#a7f3d0">Webcam video frames are processed in volatile memory via WebAssembly. Zero video or raw image frames ever leave the candidate's computer.</text>
  </g>

  <!-- 4 Pipeline Columns -->
  <!-- STEP 1: Video Capture -->
  <g transform="translate(60, 155)">
    <rect width="250" height="380" rx="12" fill="#0f172a" stroke="#334155" stroke-width="1.5" filter="url(#shadow5)"/>
    <rect width="250" height="3" rx="1.5" fill="url(#cam-cyan)"/>
    
    <text x="18" y="30" class="card-title">1. Real-Time Video</text>
    <text x="18" y="48" class="card-sub" fill="#38bdf8">Webcam Feed • HTML5 Canvas</text>

    <g transform="translate(18, 70)">
      <rect width="214" height="60" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>
      <text x="12" y="24" class="code-pill">navigator.mediaDevices</text>
      <text x="12" y="44" class="card-desc">30 FPS continuous stream</text>
    </g>

    <text x="18" y="160" class="card-desc">• Frame-by-frame extraction</text>
    <text x="18" y="180" class="card-desc">• Scaled for WASM pipeline</text>
    <text x="18" y="200" class="card-desc">• Real-time lighting normalization</text>
    <text x="18" y="220" class="card-desc">• No server latency / lag</text>

    <!-- Visual Camera preview box -->
    <g transform="translate(18, 250)">
      <rect width="214" height="100" rx="8" fill="#111827" stroke="#0284c7" stroke-width="1"/>
      <circle cx="107" cy="45" r="24" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5"/>
      <circle cx="107" cy="40" r="10" fill="#38bdf8" fill-opacity="0.3"/>
      <path d="M 92,60 Q 107,72 122,60" stroke="#38bdf8" stroke-width="1.5" fill="none"/>
      <text x="65" y="86" class="code-pill">Live Face Detection</text>
    </g>
  </g>

  <!-- Connect 1 to 2 -->
  <path d="M 310,345 L 334,345" fill="none" stroke="#38bdf8" stroke-width="2" marker-end="url(#arr5)"/>

  <!-- STEP 2: MediaPipe Face Landmarker -->
  <g transform="translate(340, 155)">
    <rect width="250" height="380" rx="12" fill="#0f172a" stroke="#334155" stroke-width="1.5" filter="url(#shadow5)"/>
    <rect width="250" height="3" rx="1.5" fill="url(#vision-purple)"/>
    
    <text x="18" y="30" class="card-title">2. MediaPipe Vision</text>
    <text x="18" y="48" class="card-sub" fill="#c084fc">Tasks Vision SDK • WASM</text>

    <g transform="translate(18, 70)">
      <rect width="214" height="60" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>
      <text x="12" y="24" class="code-pill">Face Landmarker 3D</text>
      <text x="12" y="44" class="card-desc">478 Facial Landmarks</text>
    </g>

    <text x="18" y="160" class="card-desc">• Gaze direction &amp; vector</text>
    <text x="18" y="180" class="card-desc">• Head pitch, yaw, and roll</text>
    <text x="18" y="200" class="card-desc">• Eye contact ratio tracking</text>
    <text x="18" y="220" class="card-desc">• Face presence ratio detector</text>
    <text x="18" y="240" class="card-desc">• Blendshapes &amp; micro-movement</text>

    <!-- Mesh Graphic -->
    <g transform="translate(18, 265)">
      <rect width="214" height="85" rx="8" fill="#1e293b" stroke="#6d28d9" stroke-width="1"/>
      <path d="M 40,42 L 70,25 L 107,20 L 144,25 L 174,42 L 150,70 L 107,75 L 64,70 Z" stroke="#a78bfa" stroke-width="1" fill="none"/>
      <circle cx="75" cy="38" r="3" fill="#a78bfa"/>
      <circle cx="139" cy="38" r="3" fill="#a78bfa"/>
      <path d="M 95,55 Q 107,60 119,55" stroke="#c084fc" stroke-width="1.5" fill="none"/>
      <text x="45" y="76" class="code-pill">3D Landmark Mesh</text>
    </g>
  </g>

  <!-- Connect 2 to 3 -->
  <path d="M 590,345 L 614,345" fill="none" stroke="#a78bfa" stroke-width="2" marker-end="url(#arr5-purple)"/>

  <!-- STEP 3: ONNX Runtime Web Emotion Engine -->
  <g transform="translate(620, 155)">
    <rect width="250" height="380" rx="12" fill="#0f172a" stroke="#334155" stroke-width="1.5" filter="url(#shadow5)"/>
    <rect width="250" height="3" rx="1.5" fill="url(#onnx-emerald)"/>
    
    <text x="18" y="30" class="card-title">3. ONNX Runtime Web</text>
    <text x="18" y="48" class="card-sub" fill="#34d399">In-Browser Neural Net</text>

    <g transform="translate(18, 70)">
      <rect width="214" height="60" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>
      <text x="12" y="24" class="code-pill">public/models/emotion.onnx</text>
      <text x="12" y="44" class="card-desc">Micro-expression classifier</text>
    </g>

    <text x="18" y="160" class="card-desc">• Frame-level Softmax distribution</text>
    <text x="18" y="180" class="card-desc">• Classes classified:</text>
    <text x="24" y="200" class="code-pill">• Neutral, Confident, Happy</text>
    <text x="24" y="218" class="code-pill">• Surprised, Fearful, Anxious</text>
    <text x="18" y="240" class="card-desc">• Windowed moving average filter</text>
    <text x="18" y="260" class="card-desc">• Removes momentary blinks/tics</text>

    <g transform="translate(18, 280)">
      <rect width="214" height="70" rx="8" fill="#1e293b" stroke="#059669" stroke-width="1"/>
      <text x="10" y="22" class="card-sub" fill="#34d399">WASM Inference Speed:</text>
      <text x="10" y="42" class="code-pill">~12ms / frame (smooth 30fps)</text>
      <text x="10" y="60" class="card-desc">Zero server CPU consumption</text>
    </g>
  </g>

  <!-- Connect 3 to 4 -->
  <path d="M 870,345 L 894,345" fill="none" stroke="#34d399" stroke-width="2" marker-end="url(#arr5-emerald)"/>

  <!-- STEP 4: Aggregated Behavior Metrics -->
  <g transform="translate(900, 155)">
    <rect width="240" height="380" rx="12" fill="#0f172a" stroke="#f59e0b" stroke-width="1.5" filter="url(#shadow5)"/>
    <rect width="240" height="3" rx="1.5" fill="url(#metric-amber)"/>
    
    <text x="18" y="30" class="card-title">4. Behavior Metrics</text>
    <text x="18" y="48" class="card-sub" fill="#fbbf24">lib/behavior-metrics.ts</text>

    <!-- Metrics Cards -->
    <g transform="translate(14, 65)">
      <rect width="212" height="58" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>
      <text x="10" y="20" class="card-sub" fill="#38bdf8">Confidence Score</text>
      <text x="10" y="40" class="card-title" fill="#38bdf8" font-size="20">88 / 100</text>
      <text x="100" y="40" class="card-desc">"Very Confident"</text>
    </g>

    <g transform="translate(14, 132)">
      <rect width="212" height="58" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>
      <text x="10" y="20" class="card-sub" fill="#10b981">Eye Contact Ratio</text>
      <text x="10" y="40" class="card-title" fill="#10b981" font-size="20">92%</text>
      <text x="75" y="40" class="card-desc">Direct gaze locked</text>
    </g>

    <g transform="translate(14, 199)">
      <rect width="212" height="58" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>
      <text x="10" y="20" class="card-sub" fill="#c084fc">Anxiety Index</text>
      <text x="10" y="40" class="card-title" fill="#c084fc" font-size="20">Low</text>
      <text x="70" y="40" class="card-desc">Composed delivery</text>
    </g>

    <!-- Saved to MongoDB with evaluation -->
    <g transform="translate(14, 268)">
      <rect width="212" height="92" rx="8" fill="#1e293b" stroke="#d97706" stroke-width="1"/>
      <text x="10" y="20" class="card-sub" fill="#fbbf24">Saved to Session DB</text>
      <text x="10" y="38" class="code-pill">interviewAnswerEvaluations</text>
      <text x="10" y="56" class="card-desc">Sent to Groq with answer</text>
      <text x="10" y="74" class="card-desc">Included in final report</text>
    </g>
  </g>
</svg>

