<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="100%" height="100%">
  <defs>
    <linearGradient id="bg3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0e1a"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#0a0e1a"/>
    </linearGradient>
    <linearGradient id="node-cyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
    <linearGradient id="node-purple" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>
    <linearGradient id="node-emerald" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="node-amber" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#ea580c"/>
    </linearGradient>
    <linearGradient id="node-rose" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f43f5e"/>
      <stop offset="100%" stop-color="#e11d48"/>
    </linearGradient>

    <filter id="shadow3" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
    <filter id="glow-p3" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="8" flood-color="#8b5cf6" flood-opacity="0.4"/>
    </filter>

    <marker id="arr3" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#38bdf8" />
    </marker>
    <marker id="arr3-purple" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#a78bfa" />
    </marker>
    <marker id="arr3-emerald" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#34d399" />
    </marker>
  </defs>

  <style>
    .title { font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; font-weight: 800; fill: #ffffff; }
    .subtitle { font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; font-weight: 400; fill: #94a3b8; }
    .node-title { font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; font-weight: 700; font-size: 13.5px; fill: #f8fafc; }
    .node-num { font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; font-weight: 800; font-size: 11px; fill: #ffffff; }
    .node-body { font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; font-weight: 400; font-size: 11.5px; fill: #94a3b8; }
    .pill { font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; font-weight: 600; font-size: 10px; }
    .code-sm { font-family: 'JetBrains Mono', 'Fira Code', monospace; font-size: 10.5px; fill: #38bdf8; }
    .phase-label { font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; font-weight: 800; font-size: 12px; letter-spacing: 0.08em; text-transform: uppercase; }
  </style>

  <!-- Canvas -->
  <rect width="1200" height="800" rx="16" fill="url(#bg3)" stroke="#334155" stroke-width="1.2"/>

  <!-- Grid decoration -->
  <g opacity="0.05">
    <path d="M 0,100 L 1200,100 M 0,250 L 1200,250 M 0,550 L 1200,550" stroke="#ffffff" stroke-width="1"/>
    <path d="M 400,0 L 400,800 M 800,0 L 800,800" stroke="#ffffff" stroke-width="1"/>
  </g>

  <!-- Header -->
  <g transform="translate(60, 40)">
    <rect x="0" y="0" width="40" height="40" rx="10" fill="url(#node-purple)" filter="url(#glow-p3)"/>
    <circle cx="20" cy="20" r="10" stroke="#ffffff" stroke-width="2.5" fill="none"/>
    <circle cx="20" cy="20" r="4" fill="#ffffff"/>
    <text x="54" y="20" class="title" font-size="22">LangGraph 6-Node Adaptive Interview Agent</text>
    <text x="54" y="38" class="subtitle" font-size="13">State machine orchestrating resume vector search, conversational memory, heuristic planning, and Groq LLM</text>
  </g>

  <!-- ==================== PHASE 1: TURN 0 INTRO GATE ==================== -->
  <g transform="translate(60, 100)">
    <rect width="1080" height="100" rx="12" fill="#0f172a" stroke="#0284c7" stroke-width="1.5" stroke-dasharray="6,4" filter="url(#shadow3)"/>
    <rect x="18" y="14" width="220" height="24" rx="6" fill="#0369a1" fill-opacity="0.25"/>
    <text x="26" y="30" class="phase-label" fill="#38bdf8">Phase 1: Turn 0 — Session Opener</text>
    <text x="250" y="30" class="pill" fill="#94a3b8">latestAnswer === "" • 3-Layer Intro Protection</text>

    <!-- Request -->
    <g transform="translate(20, 48)">
      <text x="0" y="15" class="node-title">Candidate joins interview</text>
      <text x="0" y="32" class="code-sm">POST /api/interview/rag-question { latestAnswer: "" }</text>
    </g>

    <!-- Instant Gate Arrow -->
    <path d="M 470,68 L 520,68" fill="none" stroke="#38bdf8" stroke-width="2" marker-end="url(#arr3)"/>

    <!-- Fast Path Card -->
    <g transform="translate(535, 42)">
      <rect width="210" height="46" rx="8" fill="#1e293b" stroke="#0284c7" stroke-width="1"/>
      <text x="12" y="20" class="pill" fill="#38bdf8">⚡ INSTANT BYPASS (0ms LLM)</text>
      <text x="12" y="36" class="node-body">No graph invoke • No embedding</text>
    </g>

    <path d="M 755,68 L 805,68" fill="none" stroke="#38bdf8" stroke-width="2" marker-end="url(#arr3)"/>

    <!-- Return -->
    <g transform="translate(820, 42)">
      <rect width="240" height="46" rx="8" fill="#0c4a6e" fill-opacity="0.5" stroke="#0ea5e9" stroke-width="1"/>
      <text x="12" y="20" class="node-title" font-size="12px">"Tell me about yourself..."</text>
      <text x="12" y="36" class="code-sm">currentTopic: 'Introduction'</text>
    </g>
  </g>

  <!-- ==================== PHASE 2: TURN 1+ LANGGRAPH WORKFLOW ==================== -->
  <g transform="translate(60, 220)">
    <!-- Container -->
    <rect width="1080" height="540" rx="14" fill="#0f172a" stroke="#334155" stroke-width="1.5" filter="url(#shadow3)"/>
    <rect width="1080" height="3" rx="1.5" fill="url(#node-purple)"/>

    <!-- Header bar -->
    <rect x="20" y="16" width="310" height="24" rx="6" fill="#6d28d9" fill-opacity="0.25"/>
    <text x="28" y="32" class="phase-label" fill="#c084fc">Phase 2: Turn 1+ — 6-Node RAG Graph</text>
    <text x="340" y="32" class="pill" fill="#94a3b8">latestAnswer present • runInterviewRAG() executed</text>

    <!-- Input Badge -->
    <g transform="translate(20, 52)">
      <rect width="1040" height="36" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>
      <text x="16" y="23" class="pill" fill="#f8fafc">Candidate Audio/Video Answer Transcribed</text>
      <text x="300" y="23" class="code-sm">latestAnswer: "I built a microservices backend with Kafka..."</text>
      <text x="800" y="23" class="pill" fill="#a78bfa">State: topic, difficulty, turn #</text>
    </g>

    <!-- Connective arrow from input to retrieval tier -->
    <path d="M 540,88 L 540,112" fill="none" stroke="#a78bfa" stroke-width="2" marker-end="url(#arr3-purple)"/>

    <!-- ROW 1: PARALLEL RETRIEVAL NODES (Node 1, Node 2, Node 3) -->
    <!-- Node 1: retrieveResume -->
    <g transform="translate(20, 115)">
      <rect width="330" height="150" rx="10" fill="#1e293b" stroke="#0284c7" stroke-width="1.2"/>
      <rect x="14" y="14" width="22" height="22" rx="6" fill="#0284c7"/>
      <text x="22" y="29" class="node-num">1</text>
      <text x="44" y="29" class="node-title">retrieveResume</text>
      <text x="14" y="52" class="pill" fill="#38bdf8">FastEmbed • Atlas Vector Search</text>
      
      <text x="14" y="74" class="node-body">• Embeds latest candidate answer</text>
      <text x="14" y="92" class="node-body">• <tspan class="code-sm">$vectorSearch</tspan> on <tspan class="code-sm">resume_chunks</tspan></text>
      <text x="14" y="110" class="node-body">• Scoped to current candidate <tspan class="code-sm">userId</tspan></text>
      <text x="14" y="130" class="pill" fill="#10b981">→ Top 3 relevant resume chunks</text>
    </g>

    <!-- Node 2: retrieveConversation -->
    <g transform="translate(375, 115)">
      <rect width="330" height="150" rx="10" fill="#1e293b" stroke="#7c3aed" stroke-width="1.2"/>
      <rect x="14" y="14" width="22" height="22" rx="6" fill="#7c3aed"/>
      <text x="22" y="29" class="node-num">2</text>
      <text x="44" y="29" class="node-title">retrieveConversation</text>
      <text x="14" y="52" class="pill" fill="#c084fc">Semantic Memory Recall</text>
      
      <text x="14" y="74" class="node-body">• Embeds candidate Q&amp;A turn pair</text>
      <text x="14" y="92" class="node-body">• <tspan class="code-sm">$vectorSearch</tspan> on <tspan class="code-sm">conversation_memory</tspan></text>
      <text x="14" y="110" class="node-body">• Filters: <tspan class="code-sm">userId + sessionId</tspan></text>
      <text x="14" y="130" class="pill" fill="#10b981">→ Top 3 semantic past turns</text>
    </g>

    <!-- Node 3: fetchRecentMemory -->
    <g transform="translate(730, 115)">
      <rect width="330" height="150" rx="10" fill="#1e293b" stroke="#ea580c" stroke-width="1.2"/>
      <rect x="14" y="14" width="22" height="22" rx="6" fill="#ea580c"/>
      <text x="22" y="29" class="node-num">3</text>
      <text x="44" y="29" class="node-title">fetchRecentMemory</text>
      <text x="14" y="52" class="pill" fill="#fb923c">Direct MongoDB Query</text>
      
      <text x="14" y="74" class="node-body">• Direct <tspan class="code-sm">find()</tspan> sorted by createdAt desc</text>
      <text x="14" y="92" class="node-body">• <tspan fill="#f87171" font-weight="700">⚠️ NEVER</tspan> uses vector search</text>
      <text x="14" y="110" class="node-body">• Preserves exact chronological flow</text>
      <text x="14" y="130" class="pill" fill="#10b981">→ Last 5 chronological turns</text>
    </g>

    <!-- Convergence lines to Planner -->
    <path d="M 185,265 L 185,295 L 530,295 L 530,312" fill="none" stroke="#a78bfa" stroke-width="1.5"/>
    <path d="M 540,265 L 540,312" fill="none" stroke="#a78bfa" stroke-width="1.5" marker-end="url(#arr3-purple)"/>
    <path d="M 895,265 L 895,295 L 550,295 L 550,312" fill="none" stroke="#a78bfa" stroke-width="1.5"/>

    <!-- ROW 2: Node 4 (Planner) -->
    <g transform="translate(180, 318)">
      <rect width="720" height="98" rx="10" fill="#1e293b" stroke="#f59e0b" stroke-width="1.4"/>
      <rect x="16" y="12" width="22" height="22" rx="6" fill="#f59e0b"/>
      <text x="24" y="27" class="node-num">4</text>
      <text x="46" y="28" class="node-title">planner — Heuristic Decision Engine</text>
      <text x="320" y="28" class="pill" fill="#fbbf24">Adapts difficulty &amp; direction per turn</text>

      <!-- Planner Decision Rules (Columns) -->
      <g transform="translate(16, 44)">
        <rect width="128" height="42" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1"/>
        <text x="8" y="16" class="pill" fill="#38bdf8">Post-Intro Pivot</text>
        <text x="8" y="32" class="code-sm">change_topic</text>
      </g>
      <g transform="translate(152, 44)">
        <rect width="128" height="42" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1"/>
        <text x="8" y="16" class="pill" fill="#f87171">&lt;15 Words Answer</text>
        <text x="8" y="32" class="code-sm">simplify</text>
      </g>
      <g transform="translate(288, 44)">
        <rect width="128" height="42" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1"/>
        <text x="8" y="16" class="pill" fill="#fbbf24">3+ Qs on Topic</text>
        <text x="8" y="32" class="code-sm">change_topic</text>
      </g>
      <g transform="translate(424, 44)">
        <rect width="128" height="42" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1"/>
        <text x="8" y="16" class="pill" fill="#c084fc">Every 2 Questions</text>
        <text x="8" y="32" class="code-sm">increase_difficulty</text>
      </g>
      <g transform="translate(560, 44)">
        <rect width="144" height="42" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1"/>
        <text x="8" y="16" class="pill" fill="#34d399">Standard Flow</text>
        <text x="8" y="32" class="code-sm">follow_up</text>
      </g>
    </g>

    <!-- Arrow from Node 4 to Node 5 -->
    <path d="M 540,416 L 540,432" fill="none" stroke="#a78bfa" stroke-width="2" marker-end="url(#arr3-purple)"/>

    <!-- ROW 3: Node 5 (questionGenerator) & Node 6 (saveMemory) -->
    <!-- Node 5: questionGenerator -->
    <g transform="translate(20, 438)">
      <rect width="500" height="85" rx="10" fill="#1e293b" stroke="#10b981" stroke-width="1.3"/>
      <rect x="14" y="12" width="22" height="22" rx="6" fill="#10b981"/>
      <text x="22" y="27" class="node-num">5</text>
      <text x="44" y="27" class="node-title">questionGenerator (Groq qwen3.8-27b)</text>
      <text x="14" y="48" class="node-body">Synthesizes: Resume Chunks + Past Q&amp;As + Recent turns + Planner state</text>
      <text x="14" y="66" class="node-body">• Strictly asks 1 question • Hard-coded rule: NEVER repeats intro</text>
    </g>

    <!-- Arrow from Node 5 to Node 6 -->
    <path d="M 520,480 L 555,480" fill="none" stroke="#34d399" stroke-width="2" marker-end="url(#arr3-emerald)"/>

    <!-- Node 6: saveMemory -->
    <g transform="translate(560, 438)">
      <rect width="500" height="85" rx="10" fill="#1e293b" stroke="#06b6d4" stroke-width="1.3"/>
      <rect x="14" y="12" width="22" height="22" rx="6" fill="#06b6d4"/>
      <text x="22" y="27" class="node-num">6</text>
      <text x="44" y="27" class="node-title">saveMemory (Atlas Chunk Upsert)</text>
      <text x="14" y="48" class="node-body">Embeds Q&amp;A turn • Stores in <tspan class="code-sm">conversation_memory_chunks</tspan></text>
      <text x="14" y="66" class="node-body">• Increments questionCount • Infers topic • Updates <tspan class="code-sm">InterviewState</tspan></text>
    </g>
  </g>
</svg>

