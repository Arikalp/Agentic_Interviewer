<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0e1a"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#0a0e1a"/>
    </linearGradient>
    <linearGradient id="card-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.9"/>
    </linearGradient>
    <linearGradient id="cyan-glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
    <linearGradient id="purple-glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>
    <linearGradient id="emerald-glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <linearGradient id="amber-glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#ef4444"/>
    </linearGradient>
    
    <!-- Filter Glows -->
    <filter id="glow-cyan" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#06b6d4" flood-opacity="0.3"/>
    </filter>
    <filter id="glow-purple" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#8b5cf6" flood-opacity="0.3"/>
    </filter>
    <filter id="glow-emerald" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#10b981" flood-opacity="0.3"/>
    </filter>
    <filter id="card-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.5"/>
    </filter>

    <!-- Marker Arrow -->
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#06b6d4" />
    </marker>
    <marker id="arrow-purple" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#a78bfa" />
    </marker>
    <marker id="arrow-emerald" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#10b981" />
    </marker>
  </defs>

  <style>
    .title { font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; font-weight: 800; fill: #ffffff; }
    .subtitle { font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; font-weight: 400; fill: #94a3b8; }
    .section-title { font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; font-weight: 700; font-size: 14px; letter-spacing: 0.05em; text-transform: uppercase; }
    .node-title { font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; font-weight: 700; font-size: 14px; fill: #f8fafc; }
    .node-desc { font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; font-weight: 400; font-size: 11px; fill: #94a3b8; }
    .badge { font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; font-weight: 600; font-size: 10px; }
  </style>

  <!-- Background Canvas -->
  <rect width="1200" height="680" rx="16" fill="url(#bg-grad)" stroke="#334155" stroke-width="1"/>
  
  <!-- Subtle Background Grid Accent -->
  <g opacity="0.06">
    <path d="M 0,100 L 1200,100 M 0,200 L 1200,200 M 0,300 L 1200,300 M 0,400 L 1200,400 M 0,500 L 1200,500 M 0,600 L 1200,600" stroke="#ffffff" stroke-width="1"/>
    <path d="M 200,0 L 200,680 M 400,0 L 400,680 M 600,0 L 600,680 M 800,0 L 800,680 M 1000,0 L 1000,680" stroke="#ffffff" stroke-width="1"/>
  </g>

  <!-- Header Section -->
  <g transform="translate(60, 48)">
    <rect x="0" y="0" width="44" height="44" rx="10" fill="url(#cyan-glow)" filter="url(#glow-cyan)"/>
    <path d="M 14,22 L 20,28 L 30,16" stroke="#ffffff" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <text x="56" y="22" class="title" font-size="24">Intervoo — High-Level System Architecture</text>
    <text x="56" y="40" class="subtitle" font-size="13">End-to-end overview of the multi-tier agentic interview, vector RAG, and behavioral intelligence platform</text>
  </g>

  <!-- COLUMN 1: Client & On-Device Tier -->
  <g transform="translate(50, 115)">
    <!-- Section Box -->
    <rect width="250" height="525" rx="14" fill="#0f172a" fill-opacity="0.85" stroke="#334155" stroke-width="1.5" filter="url(#card-shadow)"/>
    <rect width="250" height="4" rx="2" fill="url(#cyan-glow)"/>
    <text x="20" y="32" class="section-title" fill="#06b6d4">1. Client &amp; On-Device AI</text>
    <text x="20" y="48" class="node-desc">Runs 100% in candidate's browser</text>

    <!-- Card 1.1 Next.js 16 UI -->
    <g transform="translate(15, 65)">
      <rect width="220" height="95" rx="10" fill="url(#card-grad)" stroke="#1e293b" stroke-width="1.2"/>
      <circle cx="28" cy="26" r="12" fill="#06b6d4" fill-opacity="0.15"/>
      <path d="M 22,26 L 34,26 M 28,20 L 28,32" stroke="#06b6d4" stroke-width="2" stroke-linecap="round"/>
      <text x="48" y="24" class="node-title">Next.js 16 UI Layer</text>
      <text x="48" y="38" class="badge" fill="#38bdf8">React 19 • App Router</text>
      <text x="16" y="60" class="node-desc">Tailwind 4, Framer Motion, PWA</text>
      <text x="16" y="76" class="node-desc">Real-time video &amp; voice interaction</text>
    </g>

    <!-- Card 1.2 MediaPipe Face Landmarker -->
    <g transform="translate(15, 175)">
      <rect width="220" height="95" rx="10" fill="url(#card-grad)" stroke="#1e293b" stroke-width="1.2"/>
      <circle cx="28" cy="26" r="12" fill="#3b82f6" fill-opacity="0.15"/>
      <circle cx="28" cy="26" r="6" stroke="#3b82f6" stroke-width="2" fill="none"/>
      <circle cx="28" cy="26" r="2" fill="#3b82f6"/>
      <text x="48" y="24" class="node-title">MediaPipe Vision</text>
      <text x="48" y="38" class="badge" fill="#60a5fa">Face Landmarker (30 fps)</text>
      <text x="16" y="60" class="node-desc">478 3D landmarks for real-time</text>
      <text x="16" y="76" class="node-desc">eye-contact &amp; pose tracking</text>
    </g>

    <!-- Card 1.3 ONNX Runtime Web -->
    <g transform="translate(15, 285)">
      <rect width="220" height="95" rx="10" fill="url(#card-grad)" stroke="#1e293b" stroke-width="1.2"/>
      <circle cx="28" cy="26" r="12" fill="#10b981" fill-opacity="0.15"/>
      <path d="M 23,26 L 27,30 L 33,22" stroke="#10b981" stroke-width="2" stroke-linecap="round" fill="none"/>
      <text x="48" y="24" class="node-title">ONNX Runtime Web</text>
      <text x="48" y="38" class="badge" fill="#34d399">In-Browser Micro-Models</text>
      <text x="16" y="60" class="node-desc">Emotion classification (WASM)</text>
      <text x="16" y="76" class="node-desc">Confidence &amp; anxiety metrics</text>
    </g>

    <!-- Card 1.4 Clerk Auth -->
    <g transform="translate(15, 395)">
      <rect width="220" height="95" rx="10" fill="url(#card-grad)" stroke="#1e293b" stroke-width="1.2"/>
      <circle cx="28" cy="26" r="12" fill="#8b5cf6" fill-opacity="0.15"/>
      <rect x="23" y="22" width="10" height="9" rx="2" stroke="#8b5cf6" stroke-width="1.8" fill="none"/>
      <path d="M 25,22 L 25,18 C 25,16.5 31,16.5 31,18 L 31,22" stroke="#8b5cf6" stroke-width="1.8" fill="none"/>
      <text x="48" y="24" class="node-title">Clerk Auth SDK</text>
      <text x="48" y="38" class="badge" fill="#c084fc">Protected Sessions</text>
      <text x="16" y="60" class="node-desc">Session token passing to API</text>
      <text x="16" y="76" class="node-desc">Per-user isolated workspace</text>
    </g>
  </g>

  <!-- COLUMN 2: Next.js Server & Core Handlers -->
  <g transform="translate(330, 115)">
    <rect width="250" height="525" rx="14" fill="#0f172a" fill-opacity="0.85" stroke="#334155" stroke-width="1.5" filter="url(#card-shadow)"/>
    <rect width="250" height="4" rx="2" fill="url(#purple-glow)"/>
    <text x="20" y="32" class="section-title" fill="#a78bfa">2. API &amp; Server Layer</text>
    <text x="20" y="48" class="node-desc">Next.js App Router API Routes</text>

    <!-- Card 2.1 Resume Extraction Route -->
    <g transform="translate(15, 65)">
      <rect width="220" height="95" rx="10" fill="url(#card-grad)" stroke="#1e293b" stroke-width="1.2"/>
      <text x="16" y="24" class="node-title">POST /api/resume</text>
      <text x="16" y="38" class="badge" fill="#a78bfa">pdf-parse • mammoth</text>
      <text x="16" y="60" class="node-desc">Extracts text from PDF/DOCX</text>
      <text x="16" y="76" class="node-desc">Triggers Groq parsing &amp; chunker</text>
    </g>

    <!-- Card 2.2 RAG Question Route -->
    <g transform="translate(15, 175)">
      <rect width="220" height="95" rx="10" fill="url(#card-grad)" stroke="#1e293b" stroke-width="1.2"/>
      <text x="16" y="24" class="node-title">POST /api/interview/rag</text>
      <text x="16" y="38" class="badge" fill="#38bdf8">Turn 0 Gate + LangGraph</text>
      <text x="16" y="60" class="node-desc">Turn 0: Intro question instant</text>
      <text x="16" y="76" class="node-desc">Turn 1+: 6-node state graph</text>
    </g>

    <!-- Card 2.3 Evaluation Route -->
    <g transform="translate(15, 285)">
      <rect width="220" height="95" rx="10" fill="url(#card-grad)" stroke="#1e293b" stroke-width="1.2"/>
      <text x="16" y="24" class="node-title">POST /api/interview/eval</text>
      <text x="16" y="38" class="badge" fill="#f472b6">Groq Answer Evaluator</text>
      <text x="16" y="60" class="node-desc">Scores candidate answer against</text>
      <text x="16" y="76" class="node-desc">resume context + behavior data</text>
    </g>

    <!-- Card 2.4 Razorpay Webhook & Verify -->
    <g transform="translate(15, 395)">
      <rect width="220" height="95" rx="10" fill="url(#card-grad)" stroke="#1e293b" stroke-width="1.2"/>
      <text x="16" y="24" class="node-title">POST /api/payment/*</text>
      <text x="16" y="38" class="badge" fill="#fbbf24">Razorpay Orders &amp; Webhook</text>
      <text x="16" y="60" class="node-desc">HMAC SHA-256 signature verify</text>
      <text x="16" y="76" class="node-desc">Idempotent Pro plan upgrade</text>
    </g>
  </g>

  <!-- COLUMN 3: AI & Agent Intelligence -->
  <g transform="translate(610, 115)">
    <rect width="260" height="525" rx="14" fill="#0f172a" fill-opacity="0.85" stroke="#334155" stroke-width="1.5" filter="url(#card-shadow)"/>
    <rect width="260" height="4" rx="2" fill="url(#emerald-glow)"/>
    <text x="20" y="32" class="section-title" fill="#34d399">3. Agentic AI &amp; Embeddings</text>
    <text x="20" y="48" class="node-desc">LangGraph state machine &amp; LLMs</text>

    <!-- Card 3.1 LangGraph 6-Node Graph -->
    <g transform="translate(15, 65)">
      <rect width="230" height="135" rx="10" fill="url(#card-grad)" stroke="#10b981" stroke-width="1.5" filter="url(#glow-emerald)"/>
      <text x="16" y="24" class="node-title">LangGraph StateGraph</text>
      <text x="16" y="40" class="badge" fill="#10b981">6-Node Adaptive Pipeline</text>
      <text x="16" y="62" class="node-desc">• Node 1: retrieveResume</text>
      <text x="16" y="78" class="node-desc">• Node 2: retrieveConversation</text>
      <text x="16" y="94" class="node-desc">• Node 3: fetchRecentMemory</text>
      <text x="16" y="110" class="node-desc">• Node 4: planner (Heuristics)</text>
      <text x="16" y="126" class="node-desc">• Node 5: questionGen • 6: save</text>
    </g>

    <!-- Card 3.2 Groq LLM API -->
    <g transform="translate(15, 215)">
      <rect width="230" height="95" rx="10" fill="url(#card-grad)" stroke="#1e293b" stroke-width="1.2"/>
      <text x="16" y="24" class="node-title">Groq LLM Acceleration</text>
      <text x="16" y="38" class="badge" fill="#fb923c">qwen/qwen3.8-27b</text>
      <text x="16" y="60" class="node-desc">Sub-second generation latency</text>
      <text x="16" y="76" class="node-desc">Structured JSON &amp; adaptive Qs</text>
    </g>

    <!-- Card 3.3 FastEmbed ONNX -->
    <g transform="translate(15, 325)">
      <rect width="230" height="95" rx="10" fill="url(#card-grad)" stroke="#1e293b" stroke-width="1.2"/>
      <text x="16" y="24" class="node-title">FastEmbed Local ONNX</text>
      <text x="16" y="38" class="badge" fill="#38bdf8">BAAI/bge-small-en-v1.5</text>
      <text x="16" y="60" class="node-desc">384-dimensional dense vectors</text>
      <text x="16" y="76" class="node-desc">No external API rate limits</text>
    </g>

    <!-- Card 3.4 Section-Aware Chunker -->
    <g transform="translate(15, 435)">
      <rect width="230" height="75" rx="10" fill="url(#card-grad)" stroke="#1e293b" stroke-width="1.2"/>
      <text x="16" y="24" class="node-title">Section-Aware Chunker</text>
      <text x="16" y="42" class="node-desc">Semantic slicing (Projects, Skills,</text>
      <text x="16" y="58" class="node-desc">Experience) + 300-char fallback</text>
    </g>
  </g>

  <!-- COLUMN 4: Data & Cloud Infrastructure -->
  <g transform="translate(900, 115)">
    <rect width="250" height="525" rx="14" fill="#0f172a" fill-opacity="0.85" stroke="#334155" stroke-width="1.5" filter="url(#card-shadow)"/>
    <rect width="250" height="4" rx="2" fill="url(#amber-glow)"/>
    <text x="20" y="32" class="section-title" fill="#f59e0b">4. Persistence &amp; Services</text>
    <text x="20" y="48" class="node-desc">MongoDB Atlas &amp; Razorpay</text>

    <!-- Card 4.1 Atlas Vector Search -->
    <g transform="translate(15, 65)">
      <rect width="220" height="110" rx="10" fill="url(#card-grad)" stroke="#f59e0b" stroke-width="1.3"/>
      <text x="16" y="24" class="node-title">Atlas Vector Search</text>
      <text x="16" y="40" class="badge" fill="#fbbf24">$vectorSearch Aggregation</text>
      <text x="16" y="62" class="node-desc">• resume_vector_index (userId)</text>
      <text x="16" y="78" class="node-desc">• conversation_vector_index</text>
      <text x="16" y="94" class="node-desc">  (userId + sessionId filters)</text>
    </g>

    <!-- Card 4.2 Document Collections -->
    <g transform="translate(15, 190)">
      <rect width="220" height="115" rx="10" fill="url(#card-grad)" stroke="#1e293b" stroke-width="1.2"/>
      <text x="16" y="24" class="node-title">Document Collections</text>
      <text x="16" y="40" class="badge" fill="#94a3b8">MongoDB Atlas Cluster</text>
      <text x="16" y="62" class="node-desc">• users (Plan, Pro status)</text>
      <text x="16" y="78" class="node-desc">• resumeInsights (Groq analysis)</text>
      <text x="16" y="94" class="node-desc">• interviewAnswerEvaluations</text>
    </g>

    <!-- Card 4.3 Razorpay Gateway -->
    <g transform="translate(15, 320)">
      <rect width="220" height="90" rx="10" fill="url(#card-grad)" stroke="#1e293b" stroke-width="1.2"/>
      <text x="16" y="24" class="node-title">Razorpay Gateway</text>
      <text x="16" y="40" class="badge" fill="#38bdf8">One-time ₹499 Pro</text>
      <text x="16" y="62" class="node-desc">Checkout modal + Webhooks</text>
      <text x="16" y="78" class="node-desc">UPI, Cards, NetBanking</text>
    </g>

    <!-- Card 4.4 Vercel Platform -->
    <g transform="translate(15, 425)">
      <rect width="220" height="85" rx="10" fill="url(#card-grad)" stroke="#1e293b" stroke-width="1.2"/>
      <text x="16" y="24" class="node-title">Vercel Deployment</text>
      <text x="16" y="40" class="badge" fill="#cbd5e1">Edge &amp; Serverless</text>
      <text x="16" y="62" class="node-desc">Global Edge CDN &amp; Analytics</text>
      <text x="16" y="76" class="node-desc">HTTPS &amp; PWA Service Worker</text>
    </g>
  </g>

  <!-- Connective Arrows -->
  <g fill="none" stroke-width="2">
    <!-- Col 1 to Col 2 -->
    <path d="M 300,230 L 324,230" stroke="#06b6d4" marker-end="url(#arrow)"/>
    <path d="M 300,340 L 324,340" stroke="#06b6d4" marker-end="url(#arrow)"/>
    
    <!-- Col 2 to Col 3 -->
    <path d="M 580,230 L 604,230" stroke="#a78bfa" marker-end="url(#arrow-purple)"/>
    <path d="M 580,340 L 604,340" stroke="#a78bfa" marker-end="url(#arrow-purple)"/>

    <!-- Col 3 to Col 4 -->
    <path d="M 870,180 L 894,180" stroke="#10b981" marker-end="url(#arrow-emerald)"/>
    <path d="M 870,250 L 894,250" stroke="#10b981" marker-end="url(#arrow-emerald)"/>
  </g>
</svg>

