<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 540" width="100%" height="100%">
  <defs>
    <linearGradient id="bg4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0e1a"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#0a0e1a"/>
    </linearGradient>
    <linearGradient id="pay-blue" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <linearGradient id="pay-amber" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#ea580c"/>
    </linearGradient>
    <linearGradient id="pay-emerald" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>

    <filter id="shadow4" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#000000" flood-opacity="0.5"/>
    </filter>

    <marker id="arr4" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#38bdf8" />
    </marker>
    <marker id="arr4-amber" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#fbbf24" />
    </marker>
    <marker id="arr4-emerald" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#34d399" />
    </marker>
  </defs>

  <style>
    .title { font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; font-weight: 800; fill: #ffffff; }
    .subtitle { font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; font-weight: 400; fill: #94a3b8; }
    .step-box-title { font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; font-weight: 700; font-size: 14px; fill: #f8fafc; }
    .step-box-sub { font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; font-weight: 600; font-size: 11px; }
    .step-box-text { font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; font-weight: 400; font-size: 11.5px; fill: #94a3b8; }
    .code-txt { font-family: 'JetBrains Mono', 'Fira Code', monospace; font-size: 11px; fill: #38bdf8; }
    .badge-tag { font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; font-weight: 700; font-size: 10px; }
  </style>

  <!-- Background -->
  <rect width="1200" height="540" rx="16" fill="url(#bg4)" stroke="#334155" stroke-width="1.2"/>

  <!-- Subtle grid -->
  <g opacity="0.05">
    <path d="M 0,100 L 1200,100 M 0,250 L 1200,250 M 0,400 L 1200,400" stroke="#ffffff" stroke-width="1"/>
    <path d="M 300,0 L 300,540 M 600,0 L 600,540 M 900,0 L 900,540" stroke="#ffffff" stroke-width="1"/>
  </g>

  <!-- Header -->
  <g transform="translate(60, 40)">
    <rect x="0" y="0" width="40" height="40" rx="10" fill="url(#pay-amber)"/>
    <text x="14" y="26" font-family="system-ui, sans-serif" font-weight="900" font-size="18" fill="#ffffff">₹</text>
    <text x="54" y="20" class="title" font-size="22">Razorpay Pro Upgrade &amp; Verification Architecture</text>
    <text x="54" y="38" class="subtitle" font-size="13">One-time ₹499 lifetime upgrade flow featuring dual-layer HMAC signature verification and webhook backup</text>
  </g>

  <!-- Step 1: Client Initiate -->
  <g transform="translate(60, 110)">
    <rect width="250" height="180" rx="12" fill="#0f172a" stroke="#334155" stroke-width="1.5" filter="url(#shadow4)"/>
    <rect width="250" height="3" rx="1.5" fill="url(#pay-blue)"/>
    
    <text x="16" y="28" class="step-box-title">1. Candidate Action</text>
    <text x="16" y="46" class="badge-tag" fill="#38bdf8">Pricing Modal • One-Time ₹499</text>
    
    <text x="16" y="74" class="step-box-text">• Candidate clicks "Upgrade to Pro"</text>
    <text x="16" y="94" class="step-box-text">• Authenticated via Clerk session</text>
    <text x="16" y="116" class="code-txt">POST /api/payment/order</text>
    <text x="16" y="136" class="step-box-text">• Server invokes Razorpay SDK</text>
    <text x="16" y="154" class="step-box-text">• Creates order of 49,900 paise</text>
  </g>

  <!-- Step 2: Razorpay Modal -->
  <g transform="translate(350, 110)">
    <rect width="250" height="180" rx="12" fill="#0f172a" stroke="#334155" stroke-width="1.5" filter="url(#shadow4)"/>
    <rect width="250" height="3" rx="1.5" fill="url(#pay-blue)"/>
    
    <text x="16" y="28" class="step-box-title">2. Razorpay Checkout</text>
    <text x="16" y="46" class="badge-tag" fill="#38bdf8">Client-side Checkout Modal</text>
    
    <text x="16" y="74" class="step-box-text">Payment Methods Supported:</text>
    <text x="16" y="94" class="step-box-text">• UPI (GPay, PhonePe, Paytm)</text>
    <text x="16" y="112" class="step-box-text">• Credit &amp; Debit Cards</text>
    <text x="16" y="130" class="step-box-text">• NetBanking &amp; Digital Wallets</text>
    <text x="16" y="154" class="pill" fill="#10b981">✓ Success payload returned to app</text>
  </g>

  <!-- Connect 1 to 2 -->
  <path d="M 310,200 L 344,200" fill="none" stroke="#38bdf8" stroke-width="2" marker-end="url(#arr4)"/>

  <!-- Step 3: Dual Verification Gateway (Wide Card) -->
  <g transform="translate(640, 110)">
    <rect width="500" height="230" rx="12" fill="#0f172a" stroke="#f59e0b" stroke-width="1.5" filter="url(#shadow4)"/>
    <rect width="500" height="3" rx="1.5" fill="url(#pay-amber)"/>
    
    <text x="20" y="28" class="step-box-title">3. Dual-Layer Verification Safety Net</text>
    <text x="20" y="46" class="badge-tag" fill="#fbbf24">Zero Drop-Off Guarantee • Cryptographic HMAC</text>

    <!-- Path A: Client Sync Verify -->
    <g transform="translate(20, 62)">
      <rect width="460" height="68" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>
      <text x="14" y="20" class="badge-tag" fill="#38bdf8">PATH A (Immediate Client Sync)</text>
      <text x="180" y="20" class="code-txt">POST /api/payment/verify</text>
      <text x="14" y="38" class="step-box-text">Calculates <tspan class="code-txt">HMAC-SHA256(order_id | payment_id, secret)</tspan></text>
      <text x="14" y="54" class="step-box-text">Matches checkout signature and activates Pro instantly</text>
    </g>

    <!-- Path B: Server-to-Server Webhook Fallback -->
    <g transform="translate(20, 142)">
      <rect width="460" height="72" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>
      <text x="14" y="20" class="badge-tag" fill="#fb923c">PATH B (Async Webhook Fallback)</text>
      <text x="195" y="20" class="code-txt">POST /api/payment/webhook</text>
      <text x="14" y="38" class="step-box-text">Razorpay server fires <tspan class="code-txt">payment.captured</tspan> event</text>
      <text x="14" y="54" class="step-box-text">Activates Pro even if user closes browser during redirect</text>
    </g>
  </g>

  <!-- Connect 2 to 3 -->
  <path d="M 600,200 L 634,200" fill="none" stroke="#fbbf24" stroke-width="2" marker-end="url(#arr4-amber)"/>

  <!-- Step 4: Database Update & Pro Perks Unlocked -->
  <g transform="translate(60, 360)">
    <rect width="1080" height="150" rx="12" fill="#0f172a" stroke="#10b981" stroke-width="1.8" filter="url(#shadow4)"/>
    <rect width="1080" height="3" rx="1.5" fill="url(#pay-emerald)"/>

    <g transform="translate(24, 20)">
      <text x="0" y="16" class="step-box-title" fill="#34d399">4. Idempotent Activation &amp; Pro Perks Unlocked</text>
      <text x="0" y="34" class="badge-tag" fill="#6ee7b7">MongoDB Atlas users collection • lib/plan.ts isUserPro()</text>

      <!-- Database Document Shape -->
      <g transform="translate(0, 50)">
        <rect width="360" height="58" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>
        <text x="14" y="22" class="code-txt">users: {</text>
        <text x="30" y="38" class="code-txt">plan: "pro", proPaymentId: "pay_...", proOrderId: "order_..."</text>
        <text x="14" y="50" class="code-txt">}</text>
      </g>

      <!-- Pro Perks (Columns) -->
      <g transform="translate(390, 50)">
        <rect width="320" height="58" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>
        <text x="14" y="22" class="badge-tag" fill="#38bdf8">♾️ Unlimited Interview Sessions</text>
        <text x="14" y="42" class="step-box-text">Session cap lifted permanently for the account</text>
      </g>

      <g transform="translate(730, 50)">
        <rect width="310" height="58" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>
        <text x="14" y="22" class="badge-tag" fill="#fbbf24">🚫 100% Ad-Free Experience</text>
        <text x="14" y="42" class="step-box-text">All AdSense banners &amp; interstitials disabled</text>
      </g>
    </g>
  </g>

  <!-- Connect Step 3 to Step 4 -->
  <path d="M 890,340 L 890,354" fill="none" stroke="#34d399" stroke-width="2" marker-end="url(#arr4-emerald)"/>
</svg>

